# Sarveda Demo API — nginx config
# For sarveda-demo.xyz ONLY
# sarveda.com will be added on cutover day

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

# Gzip
gzip on;
gzip_types application/json text/plain application/javascript;
gzip_min_length 1000;

server {
    listen 80;
    server_name api.sarveda-demo.xyz;

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect HTTP → HTTPS (uncomment after cert issued)
    # return 301 https://$host$request_uri;

    location / {
        limit_req zone=api burst=50 nodelay;

        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;

        # Stripe webhook needs raw body
        proxy_buffering off;
        proxy_request_buffering off;

        # Security headers
        add_header X-Frame-Options "DENY";
        add_header X-Content-Type-Options "nosniff";
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }
}

# HTTPS block — certbot will fill this in automatically
# Leave commented until after: certbot --nginx -d api.sarveda-demo.xyz
