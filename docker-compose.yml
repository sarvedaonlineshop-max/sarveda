version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: sarveda-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sarveda
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sarveda_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: sarveda-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  postgres_data:
  redis_data:
