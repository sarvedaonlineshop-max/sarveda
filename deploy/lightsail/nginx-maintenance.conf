# Internal pages for when nginx cannot reach the shop (port 3000) or the API (port 5000).
# Include this file inside the sarveda.com server block, then add to each proxy location:
#   HTML shop:  error_page 502 503 504 =503 /__sarveda_maintenance.html;
#   API paths:  error_page 502 503 504 =503 /__sarveda_maintenance.json;
# Do not enable proxy_intercept_errors. An application 500 must not become this page.
# The HTML file is larger than 512 bytes so Cloudflare keeps it instead of its own gateway page.

location = /__sarveda_maintenance.html {
    internal;
    alias /var/www/sarveda-maintenance/maintenance.html;
    add_header Retry-After 180 always;
    add_header Cache-Control "no-store" always;
    default_type text/html;
}

location = /__sarveda_maintenance.json {
    internal;
    alias /var/www/sarveda-maintenance/maintenance.json;
    add_header Retry-After 180 always;
    add_header Cache-Control "no-store" always;
    default_type application/json;
}
