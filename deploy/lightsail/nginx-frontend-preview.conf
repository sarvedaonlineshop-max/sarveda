# Preview only. Listens on 8080 so it cannot take port 80/443 from the live API.
# sarveda.com stays on Vercel until the cutover window.
# Next.js on 127.0.0.1:3000 still owns /api rewrites (geo, newsletter, Zoho route handlers).

server {
    listen 8080;
    server_name _;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
