# Cloudflare Global Authenticated Origin Pulls.
# The CA file on the server is /etc/ssl/sarveda/authenticated-origin-pull-ca.pem
# downloaded from https://developers.cloudflare.com/ssl/static/authenticated_origin_pull_ca.pem
# It is valid until 1 November 2029. Add Cloudflare's replacement beside it before that date.
# The dashboard switch Authenticated Origin Pulls → Global must stay on.
# Turning it off makes nginx refuse Cloudflare and the shop stops loading.

ssl_client_certificate /etc/ssl/sarveda/authenticated-origin-pull-ca.pem;
ssl_verify_client on;
