# Included from http {}. Records the shopper address Cloudflare sends,
# because the default log only stores Cloudflare's own edge address.
log_format sarveda_cf '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'cf=$http_cf_connecting_ip';
